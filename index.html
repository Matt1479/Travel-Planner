<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container my-4">
        <h1 class="text-center">Travel Planner</h1>
        <div class="row" id="calendar">
            <!-- JS will fill this -->
        </div>
        <div class="row">
            <div class="col">
                <h4 class="mt-4">Total Cost: $<span id="totalCost">0</span></h4>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="tripModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="tripForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Trip</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" data-id="">
                        <div class="mb-2">
                            <label for="cost">Cost</label>
                            <input type="number" step="0.01" class="form-control" id="cost" required>
                        </div>
                        <div class="mb-2">
                            <label for="date">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="mb-2">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" required>
                        </div>
                        <div class="mb-2">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" required>
                        </div>
                        <div class="mb-2">
                            <label for="weather">Weather</label>
                            <input type="text" class="form-control" disabled id="weather" placeholder="Auto-filled...">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button hidden type="button" class="btn btn-danger me-auto" id="delete" data-id="">Delete</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="addNew">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/redux/4.2.1/redux.min.js"></script>
    <script src="redux/actions.js"></script>
    <script src="redux/reducers.js"></script>
    <script src="redux/store.js"></script>
    <script src="app.js"></script>
</body>

</html>
